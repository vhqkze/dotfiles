# vim:syntax=tmux:

set-option -s dark-theme-black       "#24283b"
set-option -s dark-theme-white       "#c0caf5"
set-option -s dark-theme-light-grey  "#414868"
set-option -s dark-theme-dark-grey   "#363a4f"
set-option -s dark-theme-green       "#9ece6a"
set-option -s dark-theme-yellow      "#e0af68"
set-option -s dark-theme-red         "#bb9af7"
set-option -s dark-theme-blue        "#7aa2f7"
set-option -s dark-theme-cyan        "#7dcfff"
set-option -s dark-theme-magenta     "#f7768e"

set-option -s light-theme-black      "#faf4ed"
set-option -s light-theme-white      "#464261"
set-option -s light-theme-light-grey "#beb9bd"
set-option -s light-theme-dark-grey  "#f2e9e1"
set-option -s light-theme-green      "#6d8f89"
set-option -s light-theme-yellow     "#ea9d34"
set-option -s light-theme-red        "#d7827e"
set-option -s light-theme-blue       "#286983"
set-option -s light-theme-cyan       "#56949f"
set-option -s light-theme-magenta    "#907aa9"


set-option -s default-terminal "tmux-256color"
set-option -s escape-time 10
set-option -s focus-events on
set-option -s get-clipboard request
set-option -s set-clipboard on

set-option -g base-index 1
set-option -g display-time 1000
set-option -g history-limit 30000
set-option -g mouse on
set-option -g renumber-windows on  # 关掉某个窗口后，编号重排
set-option -g set-titles on
set-option -g set-titles-string "tmux-#W"
set-option -g status-interval 1
set-option -g status-keys vi
set-option -g status-left "#[fg=themeblack,bg=themered] #S #[fg=themered,bg=themeblack]"
set-option -g @custom_copy   "#[fg=themeyellow,bg=themeblack]#[fg=themeblack,bg=themeyellow] Copy #[fg=themeblack,bg=themeyellow]"
set-option -g @custom_prefix "#[fg=themegreen,bg=themeblack]#[fg=themeblack,bg=themegreen] ^B #[fg=themeblack,bg=themegreen]"
set-option -g @custom_sync   "#[fg=themered,bg=themeblack]#[fg=themeblack,bg=themered] Sync #[fg=themeblack,bg=themered]"
set-option -g status-right "#{?client_prefix,#{@custom_prefix},#{?pane_in_mode,#{@custom_copy},#{?synchronize-panes,#{@custom_sync},}}}"
set-option -ga status-right "#[fg=themedarkgrey,bg=themeblack]#[fg=themewhite,bg=themedarkgrey] %Y-%m-%d %H:%M:%S #[fg=themered,bg=themedarkgrey]#[fg=themeblack,bg=themered] #h "

set-option -g status-right-length 60
set-option -g status-style "bg=themeblack,fg=themewhite"
set-option -ga update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK SSH_CONNECTION"
set-option -ga update-environment "KITTY_INSTALLATION_DIR KITTY_PID KITTY_LISTEN_ON KITTY_WINDOW_ID" # kitty
set-option -ga update-environment "WEZTERM_EXECUTABLE" # wezterm

set-option -wg aggressive-resize on
set-option -wg automatic-rename on
set-option -wg clock-mode-style 24-with-seconds
set-option -wg display-panes-time 3000
set-option -wg mode-keys vi
set-option -wg mode-style "noattr,bg=themedarkgrey"
set-option -wg monitor-activity on
set-option -wg pane-base-index 1
set-option -wg pane-border-indicators colour
set-option -wg pane-border-lines single
set-option -wg pane-border-status off
set-option -wg window-status-activity-style "bright"
set-option -wg window-status-current-format "#[noattr,fg=themeblack,bg=themered]#[fg=themeblack,bg=themered] #I #W#{?#F,#F, } #[fg=themered,bg=themeblack]"
set-option -wg window-status-current-style "none"  # 移除默认的 underscore
set-option -wg window-status-format "#[fg=themeblack,bg=themedarkgrey]#[fg=themewhite,bg=themedarkgrey] #I #W#{?#F,#F, } #[fg=themedarkgrey,bg=themeblack]"
set-option -wg window-status-separator ""

# pane option 在配置文件里用 -g
set-option -g allow-passthrough on
set-option -g allow-rename off
set-option -g cursor-style blinking-bar


set-option -gF @config_dir "#{d:current_file}"

bind-key r source-file -F "#{@config_dir}/tmux.conf" \; display "Config Reloaded."
bind-key b set-option status  # toggle status line

bind-key c new-window -c "#{pane_current_path}"  # 新开窗口时保持当前路径
bind-key '%' split-window -h -c "#{pane_current_path}" # 新开面板时保持当前路径
bind-key '|' split-window -h -c "#{pane_current_path}" # 新开面板时保持当前路径
bind-key '"' split-window -v -c "#{pane_current_path}" # 新开面板时保持当前路径
bind-key '-' split-window -v -c "#{pane_current_path}" # 新开面板时保持当前路径

bind-key -r Left  swap-window -d -t -1   # 将当前窗口往前移动
bind-key -r Right swap-window -d -t +1   # 将当前窗口往后移动

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down


set-hook -g pane-mode-entered 'set-option -g cursor-style blinking-block'
set-hook -g pane-mode-exited  'set-option -g cursor-style blinking-bar'


# ============================= plugins =====================================

# 设置tpm安装的插件位置
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "$HOME/.local/share/tmux/resurrect"
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'   # Automatically restored when tmux is started
set -g @continuum-save-interval '5'

set -g @plugin 'vhqkze/seamless.nvim'

if-shell "test ! -d $HOME/.local/share/tmux/plugins/tpm" {
    run-shell "git clone https://github.com/tmux-plugins/tpm $HOME/.local/share/tmux/plugins/tpm"
    run-shell "$HOME/.local/share/tmux/plugins/tpm/bin/install_plugins"
}
run-shell -b "$HOME/.local/share/tmux/plugins/tpm/tpm"

# prefix + I: install plugins
# prefix + U: update plugins
